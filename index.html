<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tank Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;font-family:'Courier New',monospace;overflow:hidden}
canvas{display:block}
#loginScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a1e;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;color:#fff}
#loginScreen h1{font-size:40px;color:#0ff;margin-bottom:20px}
#loginScreen input{display:block;margin:8px auto;padding:12px;width:220px;background:#1a1a2e;border:2px solid #333;color:#fff;font-size:16px;font-family:'Courier New',monospace}
#loginScreen button{padding:12px 30px;margin:8px;background:#5D5CDE;color:#fff;border:none;font-size:16px;cursor:pointer;font-family:'Courier New',monospace}
#loginScreen button:hover{background:#7D7CFE}
#msg{color:#f44;font-size:13px;min-height:20px;margin:8px}
#gameUI{display:none}
#hud{position:fixed;top:10px;left:10px;color:#fff;z-index:10;font-size:14px}
</style>
</head>
<body>

<div id="loginScreen">
<h1>TANK ARENA</h1>
<input id="authUser" placeholder="Username" autocomplete="off">
<input id="authPass" type="password" placeholder="Password">
<div id="msg"></div>
<button id="loginBtn">LOGIN</button>
<button id="signupBtn">SIGN UP</button>
</div>

<div id="gameUI">
<canvas id="gameCanvas"></canvas>
<div id="hud">
<div>Score: <span id="score">0</span></div>
<div>HP: <span id="hp">100</span></div>
<div>Wave: <span id="waveDisplay">1</span></div>
</div>
</div>

<script>
// ============ LOGIN SYSTEM ============
const OWNER_USER = 'trashowner';
const OWNER_PASS = 'cnpopcatx';
let userDB = {};
let currentUser = null;
let isOwner = false;

try {
  let saved = localStorage.getItem('tankArenaDB');
  if (saved) userDB = JSON.parse(saved);
} catch(e) { userDB = {}; }

function saveDB() {
  try { localStorage.setItem('tankArenaDB', JSON.stringify(userDB)); } catch(e) {}
}

function registerUser(u, p) {
  if (!u || !p) return { ok: false, msg: 'Enter username and password' };
  if (u.length < 2) return { ok: false, msg: 'Username too short' };
  if (p.length < 3) return { ok: false, msg: 'Password too short' };
  if (userDB[u]) return { ok: false, msg: 'Username taken' };
  userDB[u] = { password: p, score: 0, wave: 0 };
  saveDB();
  return { ok: true, msg: 'Account created! Login now.' };
}

function loginUser(u, p) {
  if (!u || !p) return { ok: false, msg: 'Enter username and password' };
  if (u === OWNER_USER && p === OWNER_PASS) {
    isOwner = true;
    currentUser = OWNER_USER;
    return { ok: true, owner: true };
  }
  if (!userDB[u]) return { ok: false, msg: 'User not found' };
  if (userDB[u].password !== p) return { ok: false, msg: 'Wrong password' };
  isOwner = false;
  currentUser = u;
  return { ok: true };
}

document.getElementById('loginBtn').addEventListener('click', function() {
  let u = document.getElementById('authUser').value.trim();
  let p = document.getElementById('authPass').value;
  let r = loginUser(u, p);
  if (r.ok) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('gameUI').style.display = 'block';
    startGame();
  } else {
    document.getElementById('msg').textContent = r.msg;
  }
});

document.getElementById('signupBtn').addEventListener('click', function() {
  let u = document.getElementById('authUser').value.trim();
  let p = document.getElementById('authPass').value;
  let r = registerUser(u, p);
  document.getElementById('msg').textContent = r.msg;
  document.getElementById('msg').style.color = r.ok ? '#0f0' : '#f44';
});

// ============ GAME ============
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = { x: canvas.width/2, y: canvas.height/2, size: 20, speed: 4, hp: 100, maxHp: 100 };
let bullets = [];
let enemies = [];
let score = 0;
let wave = 1;
let gameRunning = false;
let keys = {};
let lastShot = 0;

document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function spawnEnemy() {
  let side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * canvas.width; y = -20; }
  else if (side === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
  else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
  else { x = -20; y = Math.random() * canvas.height; }
  
  enemies.push({
    x: x, y: y,
    size: 15 + Math.random() * 10,
    speed: 1 + Math.random() * 2,
    hp: 30 + wave * 5,
    maxHp: 30 + wave * 5,
    color: ['#e74c3c','#9b59b6','#e67e22','#2ecc71'][Math.floor(Math.random()*4)]
  });
}

function shoot() {
  let angle = Math.atan2(
    enemies.length ? enemies[0].y - player.y : 0,
    enemies.length ? enemies[0].x - player.x : 1
  );
  bullets.push({
    x: player.x, y: player.y,
    vx: Math.cos(angle) * 8,
    vy: Math.sin(angle) * 8,
    size: 4,
    life: 100
  });
}

function update() {
  if (!gameRunning) return;
  
  // Player movement
  if (keys['w'] || keys['arrowup']) player.y -= player.speed;
  if (keys['s'] || keys['arrowdown']) player.y += player.speed;
  if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
  if (keys['d'] || keys['arrowright']) player.x += player.speed;
  player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
  player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));
  
  // Auto shoot
  if (Date.now() - lastShot > 300 && enemies.length > 0) {
    shoot();
    lastShot = Date.now();
  }
  
  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].x += bullets[i].vx;
    bullets[i].y += bullets[i].vy;
    bullets[i].life--;
    if (bullets[i].life <= 0 || bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
      bullets.splice(i, 1);
    }
  }
  
  // Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    let dx = player.x - e.x;
    let dy = player.y - e.y;
    let dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 0) {
      e.x += (dx / dist) * e.speed;
      e.y += (dy / dist) * e.speed;
    }
    
    // Check bullet hits
    for (let j = bullets.length - 1; j >= 0; j--) {
      let b = bullets[j];
      if (Math.abs(b.x - e.x) < e.size && Math.abs(b.y - e.y) < e.size) {
        e.hp -= 25;
        bullets.splice(j, 1);
        if (e.hp <= 0) {
          score += 100;
          enemies.splice(i, 1);
          break;
        }
      }
    }
    
    // Check player collision
    if (i >= 0 && Math.abs(player.x - e.x) < player.size + e.size && Math.abs(player.y - e.y) < player.size + e.size) {
      player.hp -= 10;
      enemies.splice(i, 1);
      if (player.hp <= 0) {
        gameRunning = false;
        alert('Game Over! Score: ' + score);
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('gameUI').style.display = 'none';
        return;
      }
    }
  }
  
  // Spawn enemies
  if (enemies.length < 5 + wave) {
    spawnEnemy();
  }
  
  // Update HUD
  document.getElementById('score').textContent = score;
  document.getElementById('hp').textContent = Math.max(0, player.hp);
  document.getElementById('waveDisplay').textContent = wave;
  
  // Next wave
  if (score >= wave * 500) {
    wave++;
  }
  
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#0a0a1e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Player
  ctx.fillStyle = isOwner ? '#ff0' : '#0ff';
  ctx.fillRect(player.x - player.size, player.y - player.size, player.size * 2, player.size * 2);
  
  // HP bar
  ctx.fillStyle = '#f44';
  ctx.fillRect(player.x - 20, player.y - 30, 40, 5);
  ctx.fillStyle = '#0f0';
  ctx.fillRect(player.x - 20, player.y - 30, 40 * (player.hp / player.maxHp), 5);
  
  // Bullets
  ctx.fillStyle = '#ff0';
  for (let b of bullets) {
    ctx.fillRect(b.x - b.size, b.y - b.size, b.size * 2, b.size * 2);
  }
  
  // Enemies
  for (let e of enemies) {
    ctx.fillStyle = e.color;
    ctx.fillRect(e.x - e.size, e.y - e.size, e.size * 2, e.size * 2);
    ctx.fillStyle = '#f44';
    ctx.fillRect(e.x - e.size, e.y - e.size - 8, e.size * 2, 4);
    ctx.fillStyle = '#0f0';
    ctx.fillRect(e.x - e.size, e.y - e.size - 8, e.size * 2 * (e.hp / e.maxHp), 4);
  }
}

function startGame() {
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
  player.hp = player.maxHp;
  bullets = [];
  enemies = [];
  score = 0;
  wave = 1;
  gameRunning = true;
  update();
}

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
