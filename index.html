<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tank Arena · Chaos Edition</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;touch-action:none}
    html,body{overflow:hidden;font-family:'Courier New',monospace;background:#0a0a1a;height:100%}
    canvas{display:block}
    #authScreen, #dashScreen, #startScreen, #gameOverScreen, #settingsScreen, #ownerPanel {
      position:fixed;top:0;left:0;width:100%;height:100%;z-index:300;color:#fff;
      background:linear-gradient(135deg,#0a0a1e,#1a1a3e,#0a0a2e);
      display:flex;flex-direction:column;justify-content:center;align-items:center;
    }
    #authScreen{z-index:400} #authScreen h1{font-size:48px;color:#0ff;text-shadow:0 0 20px rgba(0,255,255,0.6);margin-bottom:6px}
    .auth-sub{font-size:12px;color:#888;margin-bottom:28px}
    .auth-box{width:300px;max-width:90vw;display:flex;flex-direction:column;gap:10px}
    .auth-input{width:100%;padding:12px;background:#111;border:2px solid #333;border-radius:8px;color:#fff;font-size:16px;font-family:'Courier New',monospace;outline:none}
    .auth-input:focus{border-color:#5D5CDE}
    .auth-btns{display:flex;gap:10px}
    .auth-btn{flex:1;padding:12px;border:2px solid #5D5CDE;border-radius:8px;background:rgba(93,92,222,0.15);color:#fff;font-size:16px;cursor:pointer;text-align:center;transition:0.2s}
    .auth-btn:hover{background:rgba(93,92,222,0.4);border-color:#0ff}
    .auth-link{color:#888;font-size:12px;text-align:center;cursor:pointer;margin-top:5px}
    .auth-link:hover{color:#0ff}
    .dash-table{width:100%;max-width:550px;border-collapse:collapse;font-size:12px;margin:10px 0}
    .dash-table th{background:rgba(93,92,222,0.3);color:#0ff;padding:8px;text-align:left}
    .dash-table td{padding:7px;border-bottom:1px solid #222;color:#ccc}
    .rank-1{color:#f1c40f;font-weight:bold}.rank-2{color:#c0c0c0;font-weight:bold}.rank-3{color:#cd7f32;font-weight:bold}
    .menu-btn, .mode-btn{padding:14px 28px;margin:8px;border:2px solid #5D5CDE;border-radius:10px;background:rgba(93,92,222,0.15);color:#fff;font-family:'Courier New',monospace;font-size:16px;cursor:pointer;text-align:center;transition:0.2s}
    .menu-btn:hover, .mode-btn:hover{background:rgba(93,92,222,0.4);border-color:#0ff;transform:scale(1.05)}
    .top-btn{position:fixed;top:20px;padding:8px 14px;background:rgba(20,20,20,0.8);border-radius:4px;z-index:20;cursor:pointer;font-size:12px;font-family:'Courier New',monospace}
    #shopBtn{right:110px;border:1px solid #f1c40f;color:#f1c40f}
    #settingsBtn{right:190px;border:1px solid #aaa;color:#aaa}
    #ownerBtn{right:20px;border:1px solid #ff0;color:#ff0;display:none}
    #hud{position:fixed;top:20px;left:20px;z-index:10;color:#fff;font-size:13px}
    #healthBar{width:180px;height:18px;background:rgba(255,255,255,0.1);border-radius:9px;overflow:hidden;margin:4px 0}
    #healthFill{height:100%;background:#2ecc71;width:100%}
    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:250}
    .panel{background:#111;border:2px solid #f1c40f;border-radius:10px;padding:20px;width:360px;max-width:92vw;max-height:85vh;overflow-y:auto;color:#fff}
    .panel h2{color:#f1c40f;text-align:center;margin-bottom:10px}
    .shop-item{display:flex;justify-content:space-between;align-items:center;padding:8px;margin:4px 0;background:rgba(255,255,255,0.03);border-radius:5px;border:1px solid #222;font-size:12px}
    .buy-btn{padding:5px 12px;border:1px solid #f1c40f;background:rgba(241,196,15,0.15);color:#f1c40f;border-radius:4px;font-size:11px;cursor:pointer}
    .buy-btn.owned{border-color:#2ecc71;color:#2ecc71;pointer-events:none}
    .buy-btn.cant{opacity:0.4;pointer-events:none}
    .close-btn{display:block;width:100%;padding:10px;background:transparent;border:1px solid #555;border-radius:4px;color:#888;font-size:13px;cursor:pointer;text-align:center;margin-top:10px}
    .toggle-btn{padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px;font-family:'Courier New',monospace}
    .toggle-btn.on{background:#1a3a1a;border:1px solid #2ecc71;color:#2ecc71}
    .toggle-btn.off{background:#3a1a1a;border:1px solid #e74c3c;color:#e74c3c}
    #ownerPanel{background:rgba(0,0,0,0.92);display:none;z-index:500}
    .owner-box{background:#0a0a0a;border:3px solid #ff0;border-radius:12px;padding:20px;width:380px;max-width:94vw;max-height:90vh;overflow-y:auto}
    .owner-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;justify-content:center}
    .owner-btn{padding:8px 14px;background:#1a1a0a;border:1px solid #ff0;color:#ff0;border-radius:6px;cursor:pointer;font-size:12px}
    .owner-btn.danger{border-color:#f44;color:#f44}
    .owner-section{color:#888;font-size:11px;text-align:center;margin:8px 0 4px;letter-spacing:2px}
    #weaponSelector{position:fixed;top:115px;left:10px;display:flex;flex-direction:column;gap:5px;z-index:10;max-height:calc(100vh - 300px);overflow-y:auto}
    .weapon-btn{padding:5px 8px;background:rgba(60,60,60,0.7);border-radius:5px;font-size:11px;display:flex;align-items:center;cursor:pointer;color:#ccc;border:2px solid transparent}
    .weapon-btn.active{border-color:#5D5CDE;background:rgba(93,92,222,0.3)}
    #controls{position:fixed;bottom:20px;left:0;width:100%;display:none;justify-content:space-between;padding:0 20px;z-index:10}
    .joystick-container{position:relative;width:150px;height:150px}
    .joystick-base{position:absolute;width:120px;height:120px;background:rgba(230,230,230,0.12);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
    .joystick-thumb{position:absolute;width:56px;height:56px;background:rgba(93,92,222,0.8);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
    #fireBtn{width:90px;height:90px;background:rgba(231,76,60,0.7);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:16px;align-self:flex-end;margin-bottom:20px}
  </style>
</head>
<body>
<div id="authScreen"><h1>TANK ARENA</h1><div class="auth-sub">Login or create account</div><div class="auth-box"><input class="auth-input" id="authUser" placeholder="Username" maxlength="20"><input class="auth-input" id="authPass" type="password" placeholder="Password" maxlength="24"><div id="authMsg" style="color:#e74c3c;font-size:12px;min-height:18px"></div><div class="auth-btns"><div class="auth-btn" id="loginBtn">LOGIN</div><div class="auth-btn" id="signupBtn">SIGN UP</div></div><div class="auth-link" id="authDashLink">🏆 Leaderboard</div></div></div>
<div id="dashScreen" style="display:none"><h2>🏆 LEADERBOARD</h2><div id="dashContent"></div><button class="menu-btn" id="dashBackBtn">BACK</button></div>
<div id="startScreen" style="display:none"><h1>TANK ARENA</h1><div id="welcomeUser" style="color:#5D5CDE;margin-bottom:20px"></div><div class="mode-btn" id="modePhone">📱 MOBILE</div><div class="mode-btn" id="modePC">⌨️ PC</div><div style="display:flex;gap:10px;margin-top:15px"><span class="auth-link" id="startDashLink">🏆 Leaderboard</span><span class="auth-link" id="logoutLink">Logout</span></div></div>
<canvas id="gameCanvas"></canvas>
<div id="controls"><div class="joystick-container" id="jContainer"><div class="joystick-base" id="jBase"></div><div class="joystick-thumb" id="jThumb"></div></div><div id="fireBtn">FIRE</div></div>
<div id="hud" style="display:none"><div id="score" style="font-size:20px">Score: 0</div><div id="healthBar"><div id="healthFill"></div></div><div style="font-size:11px;color:#888">Wave: <span id="waveNum">0</span> | Enemies: <span id="enemyCnt">0</span></div><div><span style="color:#f1c40f">💰 <span id="coinCount">0</span></span> <span style="color:#0ff">💎 <span id="diamondCount">0</span></span></div></div>
<div id="weaponSelector"></div>
<div class="top-btn" id="shopBtn" style="display:none">🛒 SHOP</div><div class="top-btn" id="settingsBtn" style="display:none">⚙️</div><div class="top-btn" id="ownerBtn">👑</div>
<div class="modal" id="shopModal"><div class="panel"><h2>🛒 SHOP</h2><div id="shopBal" style="text-align:center;color:#888;margin-bottom:10px"></div><div id="shopItems"></div><button class="close-btn" id="closeShop">CLOSE</button></div></div>
<div id="settingsScreen" style="display:none"><div class="panel" style="border-color:#aaa"><h2 style="color:#ccc">⚙️ SETTINGS</h2><div class="shop-item"><span>🎯 Aim Assist</span><button class="toggle-btn on" id="togAim">ON</button></div><div class="shop-item"><span>🔫 Auto Shoot</span><button class="toggle-btn on" id="togAuto">ON</button></div><div class="shop-item"><span>📳 Screen Shake</span><button class="toggle-btn on" id="togShake">ON</button></div><button class="close-btn" id="closeSettings">CLOSE</button></div></div>
<div id="ownerPanel"><div class="owner-box"><h2>👑 OWNER</h2><div class="owner-section">🌍 WORLDS</div><div class="owner-row"><button class="owner-btn" data-ow="w1">WASTE</button><button class="owner-btn" data-ow="w2">INFERNO</button><button class="owner-btn" data-ow="w3">GLACIER</button><button class="owner-btn" data-ow="w4">JUNGLE</button><button class="owner-btn" data-ow="w5">VOID</button></div><div class="owner-section">⚔️ COMBAT</div><div class="owner-row"><button class="owner-btn" data-ow="spawn">SPAWN</button><button class="owner-btn" data-ow="boss">BOSS</button><button class="owner-btn danger" data-ow="nuke">☢️ NUKE</button><button class="owner-btn danger" data-ow="killall">KILL ALL</button></div><div class="owner-section">💰</div><div class="owner-row"><button class="owner-btn" data-ow="coins">+1000💰</button><button class="owner-btn" data-ow="diamonds">+100💎</button><button class="owner-btn" data-ow="heal">HEAL</button></div><div class="owner-row"><button class="owner-btn" data-ow="god" id="godToggle">GOD:OFF</button><button class="owner-btn" data-ow="nextwave">NEXT WAVE</button><button class="owner-btn" data-ow="nukewep">☢️ NUKE GUN</button></div><button class="close-btn" id="closeOwner">CLOSE</button></div></div>
<div id="gameOverScreen" style="display:none"><h1 id="gameOverTitle">GAME OVER</h1><div id="gameOverStats" style="font-size:13px;color:#888;margin:8px"></div><div id="finalScore" style="font-size:28px;margin:10px">Score: 0</div><button class="menu-btn" id="restartBtn">PLAY AGAIN</button><button class="menu-btn" id="goLeaderboard" style="border-color:#555;color:#888">🏆 Leaderboard</button></div>

<script>
// ===== COMPLETE TANK ARENA · CHAOS EDITION =====
var userDB={},currentUser=null,isOwner=false;
const OWNER_USER='trashowner',OWNER_PASS='cnpopcatx';
try{var s=localStorage.getItem('ta_db');if(s)userDB=JSON.parse(s);}catch(e){}
function saveDB(){try{localStorage.setItem('ta_db',JSON.stringify(userDB));}catch(e){}}
function registerUser(u,p){if(!u||!p)return{ok:false,msg:'Username and password required'};if(u.length<2)return{ok:false,msg:'Username too short'};if(p.length<3)return{ok:false,msg:'Password too short'};if(userDB[u])return{ok:false,msg:'Username taken'};userDB[u]={password:p,deaths:0,totalCoins:0,totalDiamonds:0,bestWave:0,bestScore:0,gamesPlayed:0};saveDB();return{ok:true,msg:'Account created!'};}
function loginUser(u,p){if(!u||!p)return{ok:false,msg:'Enter username and password'};if(u===OWNER_USER&&p===OWNER_PASS){isOwner=true;currentUser=OWNER_USER;return{ok:true,owner:true};}if(!userDB[u])return{ok:false,msg:'User not found'};if(userDB[u].password!==p)return{ok:false,msg:'Wrong password'};isOwner=false;currentUser=u;return{ok:true};}
function updateUserStats(won){if(isOwner||!currentUser||!userDB[currentUser])return;var u=userDB[currentUser];u.gamesPlayed++;if(!won)u.deaths++;if(wave.cur>u.bestWave)u.bestWave=wave.cur;if(score>u.bestScore)u.bestScore=score;u.totalCoins+=coinsThisRun;u.totalDiamonds+=diamondsThisRun;saveDB();}

var settings={aimAssist:true,autoShoot:true,screenShake:true};
try{var ss=localStorage.getItem('ta_settings');if(ss)settings=JSON.parse(ss);}catch(e){}
function saveSettings(){try{localStorage.setItem('ta_settings',JSON.stringify(settings));}catch(e){}}

var worlds=[{name:'WASTELAND',bg:'#1a1a14',bg2:'#2a2a18',grid:'rgba(120,120,40,0.06)',border:'rgba(180,180,60,0.3)',corner:'rgba(200,200,0,0.15)',accent:'#cc0'},{name:'INFERNO',bg:'#2a0f0a',bg2:'#401a10',grid:'rgba(222,80,40,0.07)',border:'rgba(222,80,40,0.3)',corner:'rgba(255,100,0,0.2)',accent:'#f60'},{name:'GLACIER',bg:'#0a1a2e',bg2:'#102840',grid:'rgba(80,170,222,0.06)',border:'rgba(80,170,222,0.3)',corner:'rgba(100,200,255,0.2)',accent:'#6cf'},{name:'JUNGLE',bg:'#0a220a',bg2:'#143814',grid:'rgba(50,180,60,0.06)',border:'rgba(50,180,60,0.3)',corner:'rgba(0,255,100,0.2)',accent:'#0f8'},{name:'THE VOID',bg:'#0a0008',bg2:'#1a0a1a',grid:'rgba(180,40,222,0.08)',border:'rgba(180,40,222,0.3)',corner:'rgba(200,0,255,0.2)',accent:'#c0f'}];
function getWorldIdx(){if(wave.cur<=0)return 0;return Math.min(4,Math.floor((wave.cur-1)/10));}
function getWorld(){return worlds[getWorldIdx()];}

var canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
var scoreEl=document.getElementById('score'),healthFill=document.getElementById('healthFill');
var gameOverScreen=document.getElementById('gameOverScreen'),gameOverTitle=document.getElementById('gameOverTitle'),finalScoreEl=document.getElementById('finalScore');
var waveNumEl=document.getElementById('waveNum'),enemyCntEl=document.getElementById('enemyCnt'),coinCountEl=document.getElementById('coinCount'),diamondCountEl=document.getElementById('diamondCount');
var shopModal=document.getElementById('shopModal'),controlsDiv=document.getElementById('controls'),startScreen=document.getElementById('startScreen');
var authScreen=document.getElementById('authScreen'),dashScreen=document.getElementById('dashScreen'),authMsg=document.getElementById('authMsg');
var weaponDiv=document.getElementById('weaponSelector'),ownerPanel=document.getElementById('ownerPanel'),ownerBtn=document.getElementById('ownerBtn'),settingsScreen=document.getElementById('settingsScreen'),hudDiv=document.getElementById('hud');
var jBase=document.getElementById('jBase'),jThumb=document.getElementById('jThumb'),jContainer=document.getElementById('jContainer'),fireBtn2=document.getElementById('fireBtn');

var isMobile=false;
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;genBG();}
resizeCanvas();window.addEventListener('resize',resizeCanvas);

document.getElementById('loginBtn').addEventListener('click',function(){var u=document.getElementById('authUser').value.trim(),p=document.getElementById('authPass').value;var r=loginUser(u,p);if(r.ok){authMsg.textContent='';authScreen.style.display='none';showStartScreen();}else{authMsg.textContent=r.msg;}});
document.getElementById('signupBtn').addEventListener('click',function(){var u=document.getElementById('authUser').value.trim(),p=document.getElementById('authPass').value;var r=registerUser(u,p);authMsg.textContent=r.msg;authMsg.style.color=r.ok?'#2ecc71':'#e74c3c';});
document.getElementById('authDashLink').addEventListener('click',function(){authScreen.style.display='none';showDashboard('auth');});

var dashReturnTo='auth';
function showDashboard(from){dashReturnTo=from||'auth';dashScreen.style.display='flex';var dc=document.getElementById('dashContent'),users=Object.keys(userDB);if(users.length===0){dc.innerHTML='<p style="color:#555">No players yet.</p>';return;}users.sort(function(a,b){return userDB[b].bestScore-userDB[a].bestScore;});var h='<table class="dash-table"><tr><th>#</th><th>Player</th><th>Score</th><th>Wave</th></tr>';for(var i=0;i<Math.min(users.length,20);i++){var u=userDB[users[i]],rc=i<3?'rank-'+(i+1):'';h+='<tr><td class="'+rc+'">'+(i+1)+'</td><td class="'+rc+'">'+users[i]+(users[i]===currentUser?' *':'')+'</td><td>'+u.bestScore+'</td><td>'+u.bestWave+'</td></tr>';}h+='</table>';dc.innerHTML=h;}
document.getElementById('dashBackBtn').addEventListener('click',function(){dashScreen.style.display='none';if(dashReturnTo==='auth')authScreen.style.display='flex';else if(dashReturnTo==='start')showStartScreen();else gameOverScreen.style.display='flex';});

function showStartScreen(){startScreen.style.display='flex';document.getElementById('welcomeUser').textContent=isOwner?'👑 OWNER MODE':'Welcome, '+currentUser+'!';ownerBtn.style.display=isOwner?'block':'none';}
document.getElementById('modePhone').addEventListener('click',function(){isMobile=true;controlsDiv.style.display='flex';startGame();});
document.getElementById('modePC').addEventListener('click',function(){isMobile=false;controlsDiv.style.display='none';startGame();});
document.getElementById('startDashLink').addEventListener('click',function(){startScreen.style.display='none';showDashboard('start');});
document.getElementById('logoutLink').addEventListener('click',function(){currentUser=null;isOwner=false;startScreen.style.display='none';authScreen.style.display='flex';authMsg.textContent='';});
document.getElementById('goLeaderboard').addEventListener('click',function(){gameOverScreen.style.display='none';showDashboard('start');});

var weapons={handgun:{name:'Handgun',damage:25,cd:400,bs:8,bsz:5,bc:1,range:1000,hr:0,cr:0,icon:'🔫',color:'#f1c40f',maxAmmo:45,unlocked:true},shotgun:{name:'Shotgun',damage:15,cd:800,bs:7,bsz:4,bc:6,spread:0.3,range:400,hr:0,cr:0,icon:'🔫',color:'#e67e22',maxAmmo:20,unlocked:true},rifle:{name:'Rifle',damage:35,cd:200,bs:10,bsz:4,bc:1,range:1200,hr:0,cr:0,icon:'🔫',color:'#3498db',maxAmmo:90,unlocked:true},minigun:{name:'Minigun',damage:10,cd:50,bs:9,bsz:3,bc:1,range:800,hr:5,cr:2,maxHeat:100,icon:'🔄',color:'#7f8c8d',maxAmmo:1000,unlocked:true},'knife-melee':{name:'Knife(Melee)',damage:100,cd:500,range:50,icon:'🔪',melee:true,color:'#95a5a6',maxAmmo:-1,unlocked:true},'knife-throw':{name:'Knife(Throw)',damage:70,cd:1000,bs:6,bsz:10,bc:1,range:400,icon:'🔪',color:'#95a5a6',maxAmmo:12,unlocked:true},flamethrower:{name:'Flamethrower',damage:3,cd:30,bs:5,bsz:8,bc:3,spread:0.2,range:200,hr:3,cr:1,maxHeat:120,icon:'🔥',fx:'fire',color:'#e67e22',maxAmmo:500,unlocked:true},watergun:{name:'Water Gun',damage:0,cd:100,bs:6,bsz:6,bc:1,range:300,kb:60,icon:'💧',fx:'water',color:'#3498db',maxAmmo:80,unlocked:true},'nuke-launcher':{name:'☢️ Nuke',damage:9999,cd:3000,bs:4,bsz:30,bc:1,range:2000,hr:0,cr:0,icon:'☢️',color:'#ff0',maxAmmo:-1,unlocked:false,ownerOnly:true}};
var eTypes={normal:{color:'#9b59b6',spd:1.5,hp:50,dmg:10,sz:20,lbl:''},speeder:{color:'#2ecc71',spd:3.5,hp:25,dmg:8,sz:16,lbl:'FAST'},brute:{color:'#8b0000',spd:0.8,hp:150,dmg:25,sz:35,lbl:'BRUTE'},shooter:{color:'#e67e22',spd:1.0,hp:60,dmg:5,sz:22,lbl:'SNIPER',sRange:250,sCD:2000,sDmg:15,sSpd:4},bomber:{color:'#f1c40f',spd:2.2,hp:40,dmg:5,sz:18,lbl:'BOOM',exR:100,exD:40},healer:{color:'#1abc9c',spd:1.2,hp:70,dmg:5,sz:20,lbl:'HEAL',hRange:150,hAmt:3,hCD:2000}};
var ammo={},coins=0,diamonds=0,coinsThisRun=0,diamondsThisRun=0;
var upgrades={health:0,damage:0,shield:0,spinnerBlades:1,spinnerSpeed:0,forceShield:false,spinners:false,shieldSize:0};
var wave={cur:0,maxW:50,eTotal:0,eSpawned:0,bTotal:0,bSpawned:0,inProg:false,between:true,nextT:0,lastSpT:0,bannerTxt:'',bannerST:0,bannerDur:2500,won:false};
var tank={x:0,y:0,angle:0,spd:3,sz:20,hp:1000,maxHp:1000,curW:'handgun',heat:0,dashCD:0,dashMaxCD:2000,dashing:false,dashInv:0,godMode:false};
var bullets=[],enemies=[],eBullets=[],drops=[],particles=[],floatTexts=[];
var score=0,activeKeys={},gameActive=false,lastFire=0,gamePaused=false,animId=null,spinnerAngle=0,screenShakeAmount=0;
var joystickVec={x:0,y:0},jTouchId=null,fTouchId=null,jActive=false,jStart={x:0,y:0};

function initAmmo(){for(var k in weapons)ammo[k]=weapons[k].maxAmmo;}
initAmmo();

var bgF=[];
function genBG(){bgF=[];for(var i=0;i<50;i++)bgF.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,s:Math.random()*12+2,o:Math.random()*0.05+0.02,t:Math.floor(Math.random()*4)});}
genBG();

function drawBG(){
  var wld=getWorld(),wi=getWorldIdx(),t=Date.now();
  var grad=ctx.createLinearGradient(0,0,0,canvas.height);grad.addColorStop(0,wld.bg);grad.addColorStop(1,wld.bg2);ctx.fillStyle=grad;ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle=wld.grid;ctx.lineWidth=1;var gs=50;
  for(var x=-gs;x<canvas.width+gs;x+=gs){for(var y=-gs;y<canvas.height+gs;y+=gs){ctx.beginPath();ctx.moveTo(x,y-gs/2);ctx.lineTo(x+gs/2,y);ctx.lineTo(x,y+gs/2);ctx.lineTo(x-gs/2,y);ctx.closePath();ctx.stroke();}}
  for(var i=0;i<bgF.length;i++){var f=bgF[i];ctx.globalAlpha=f.o;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,Math.PI*2);ctx.fillStyle=f.t===0?wld.accent:(f.t===1?'#fff':wld.bg2);ctx.fill();f.y-=0.3;if(f.y<-30)f.y=canvas.height+30;}
  ctx.globalAlpha=1;

function collectDrops(){var t=Date.now();for(var i=drops.length-1;i>=0;i--){var d=drops[i];if(t-d.st>d.life){drops.splice(i,1);continue;}if(Math.hypot(tank.x-d.x,tank.y-d.y)<tank.sz/2+d.sz/2){if(d.type==='health'){tank.hp=Math.min(tank.maxHp,tank.hp+50);updateHP();}else if(d.type==='ammo'){var el=[];for(var k in weapons){if(!weapons[k].melee&&ammo[k]!==-1&&ammo[k]<weapons[k].maxAmmo)el.push(k);}if(el.length){var ch=el[Math.floor(Math.random()*el.length)];ammo[ch]=Math.min(weapons[ch].maxAmmo,ammo[ch]+Math.max(1,Math.floor(weapons[ch].maxAmmo*0.15)));updateAmmoUI();}}else if(d.type==='nuke'){for(var ni=enemies.length-1;ni>=0;ni--){enemies[ni].hp-=500;if(enemies[ni].hp<=0){handleKill(enemies[ni]);enemies.splice(ni,1);}}}drops.splice(i,1);}}
function mkParticles(x,y,type,cnt){for(var i=0;i<cnt;i++){var c,s,l,sp;switch(type){case'fire':c=['#e74c3c','#e67e22','#f1c40f'][Math.floor(Math.random()*3)];s=Math.random()*5+2;l=Math.random()*20+10;sp=Math.random()*2+.5;break;case'energy':c=['#0ff','#00e5ff','#40c4ff'][Math.floor(Math.random()*3)];s=Math.random()*4+2;l=Math.random()*15+8;sp=Math.random()*2+1;break;case'hit':c=['#f39c12','#d35400','#f1c40f'][Math.floor(Math.random()*3)];s=Math.random()*3+1;l=Math.random()*15+5;sp=Math.random()*3+1;break;case'explosion':c=['#e74c3c','#c0392b','#f39c12'][Math.floor(Math.random()*3)];s=Math.random()*6+2;l=Math.random()*30+10;sp=Math.random()*4+2;break;default:c='#fff';s=Math.random()*3+1;l=Math.random()*20+10;sp=Math.random()*2+1;}var a=Math.random()*Math.PI*2;particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:c,s:s,l:l,ml:l});}}
function fireWeapon(){var w=weapons[tank.curW];if(w.melee){for(var i=enemies.length-1;i>=0;i--){var d=Math.hypot(enemies[i].x-tank.x,enemies[i].y-tank.y);if(d<w.range&&Math.abs(normAng(Math.atan2(enemies[i].y-tank.y,enemies[i].x-tank.x)-tank.angle))<Math.PI/2){enemies[i].hp-=w.damage*dmgMult();enemies[i].x+=Math.cos(tank.angle)*20;enemies[i].y+=Math.sin(tank.angle)*20;mkParticles(enemies[i].x,enemies[i].y,'hit',5);if(enemies[i].hp<=0){handleKill(enemies[i]);enemies.splice(i,1);}}}return;}if(!w.ownerOnly&&ammo[tank.curW]!==-1){ammo[tank.curW]--;updateAmmoUI();}if(w.hr)tank.heat+=w.hr;var fx=tank.x+Math.cos(tank.angle)*(tank.sz/2+5),fy=tank.y+Math.sin(tank.angle)*(tank.sz/2+5);for(var b=0;b<w.bc;b++){var ba=tank.angle;if(w.spread)ba+=(Math.random()-0.5)*w.spread;var bl=Math.ceil((w.range||1000)/w.bs);bullets.push({x:fx,y:fy,a:ba,spd:w.bs,sz:w.bsz,dmg:w.damage*dmgMult(),life:bl,color:w.color,wType:tank.curW,fx:w.fx||null});}}
function gameOver(won){gameActive=false;if(animId){cancelAnimationFrame(animId);animId=null;}updateUserStats(won);gameOverTitle.textContent=won?'VICTORY!':'GAME OVER';gameOverTitle.style.color=won?'#2ecc71':'#e74c3c';finalScoreEl.textContent='Score: '+score;document.getElementById('gameOverStats').textContent='Wave: '+wave.cur+' | Coins: '+coinsThisRun+' | Diamonds: '+diamondsThisRun;gameOverScreen.style.display='flex';hudDiv.style.display='none';document.getElementById('shopBtn').style.display='none';document.getElementById('settingsBtn').style.display='none';}
document.getElementById('restartBtn').addEventListener('click',function(){gameOverScreen.style.display='none';showStartScreen();});
function startGame(){startScreen.style.display='none';hudDiv.style.display='block';document.getElementById('shopBtn').style.display='block';document.getElementById('settingsBtn').style.display='block';resetGame();}
function resetGame(){if(animId){cancelAnimationFrame(animId);animId=null;}tank.x=canvas.width/2;tank.y=canvas.height/2;tank.angle=0;tank.maxHp=1000+upgrades.health*100;tank.hp=tank.maxHp;tank.heat=0;tank.dashCD=0;tank.dashMaxCD=2000;tank.dashing=false;tank.dashInv=0;tank.godMode=false;tank.curW=isOwner?'nuke-launcher':'handgun';bullets=[];enemies=[];eBullets=[];drops=[];particles=[];floatTexts=[];score=0;lastFire=0;gamePaused=false;coinsThisRun=0;diamondsThisRun=0;for(var k in weapons)weapons[k].unlocked=!weapons[k].ownerOnly||isOwner;if(isOwner)weapons['nuke-launcher'].unlocked=true;initAmmo();wave.cur=0;wave.eTotal=0;wave.eSpawned=0;wave.bTotal=0;wave.bSpawned=0;wave.inProg=false;wave.between=true;wave.nextT=Date.now()+1500;wave.bannerTxt='GET READY!';wave.bannerST=Date.now();wave.won=false;spinnerAngle=0;screenShakeAmount=0;buildWeaponUI();scoreEl.textContent='Score: 0';updateHP();updateWaveUI();coinCountEl.textContent=coins;diamondCountEl.textContent=diamonds;gameActive=true;gameOverScreen.style.display='none';shopModal.style.display='none';ownerPanel.style.display='none';for(var key in activeKeys)activeKeys[key]=false;joystickVec.x=0;joystickVec.y=0;genBG();update();}
function update(){if(!gameActive)return;if(gamePaused){animId=requestAnimationFrame(update);draw();return;}var t=Date.now(),w=weapons[tank.curW];if(wave.between&&t>=wave.nextT)startWave();if(wave.inProg){spawnWaveE(t);checkWaveDone();}updateWaveUI();if(w.hr&&tank.heat>0)tank.heat=Math.max(0,tank.heat-w.cr);if(settings.aimAssist){var mx=0,my=0;if(activeKeys.up)my-=1;if(activeKeys.down)my+=1;if(activeKeys.left)mx-=1;if(activeKeys.right)mx+=1;mx+=joystickVec.x;my+=joystickVec.y;var mm=Math.sqrt(mx*mx+my*my);if(mm>1){mx/=mm;my/=mm;}tank.x+=mx*tank.spd;tank.y+=my*tank.spd;var ne=nearestEnemy();if(ne)tank.angle=Math.atan2(ne.y-tank.y,ne.x-tank.x);}else{if(activeKeys.left)tank.angle-=0.05;if(activeKeys.right)tank.angle+=0.05;var jm=Math.sqrt(joystickVec.x*joystickVec.x+joystickVec.y*joystickVec.y);if(jm>0.15){tank.x+=joystickVec.x*tank.spd;tank.y+=joystickVec.y*tank.spd;}else{if(activeKeys.up){tank.x+=Math.cos(tank.angle)*tank.spd;tank.y+=Math.sin(tank.angle)*tank.spd;}if(activeKeys.down){tank.x-=Math.cos(tank.angle)*tank.spd;tank.y-=Math.sin(tank.angle)*tank.spd;}}}tank.x=Math.max(tank.sz/2,Math.min(canvas.width-tank.sz/2,tank.x));tank.y=Math.max(tank.sz/2,Math.min(canvas.height-tank.sz/2,tank.y));var shouldFire=activeKeys.FIRE||(settings.autoShoot&&enemies.length>0),overheated=w.maxHeat&&tank.heat>=w.maxHeat,hasAmmo=w.ownerOnly||w.melee||ammo[tank.curW]===-1||ammo[tank.curW]>0;if(shouldFire&&t-lastFire>w.cd&&!overheated&&hasAmmo){fireWeapon();lastFire=t;}if(tank.dashCD>0)tank.dashCD-=16;if(tank.dashInv>0){tank.dashInv-=16;if(tank.dashInv<=0)tank.dashing=false;}if(upgrades.spinners){var spinSpeed=0.04+(upgrades.spinnerSpeed*0.015);spinnerAngle+=spinSpeed;var bladeCount=upgrades.spinnerBlades+1;for(var si=0;si<bladeCount;si++){var sa=spinnerAngle+Math.PI*2/bladeCount*si,sx=tank.x+Math.cos(sa)*45,sy=tank.y+Math.sin(sa)*45;for(var sei=enemies.length-1;sei>=0;sei--){if(Math.hypot(sx-enemies[sei].x,sy-enemies[sei].y)<enemies[sei].sz/2+8){enemies[sei].hp-=30*dmgMult();var kbForce=enemies[sei].boss?3:25;enemies[sei].x+=Math.cos(sa)*kbForce;enemies[sei].y+=Math.sin(sa)*kbForce;mkParticles(sx,sy,'hit',2);if(enemies[sei].hp<=0){handleKill(enemies[sei]);enemies.splice(sei,1);}}}}}if(upgrades.forceShield){var shieldRad=tank.sz*(1.3+upgrades.shieldSize*0.6);var shieldDmg=20*dmgMult();for(var fi=enemies.length-1;fi>=0;fi--){var fd=Math.hypot(tank.x-enemies[fi].x,tank.y-enemies[fi].y);if(fd<shieldRad&&t-enemies[fi].lastShieldHit>200){enemies[fi].hp-=shieldDmg;enemies[fi].lastShieldHit=t;if(enemies[fi].hp<=0){handleKill(enemies[fi]);enemies.splice(fi,1);}}}}for(var bi=bullets.length-1;bi>=0;bi--){var b=bullets[bi];if(b.life<=0){bullets.splice(bi,1);continue;}b.x+=b.spd*Math.cos(b.a);b.y+=b.spd*Math.sin(b.a);b.life--;if(b.x<-50||b.x>canvas.width+50||b.y<-50||b.y>canvas.height+50)bullets.splice(bi,1);}for(var ei=eBullets.length-1;ei>=0;ei--){var eb=eBullets[ei];eb.x+=eb.spd*Math.cos(eb.a);eb.y+=eb.spd*Math.sin(eb.a);eb.life--;if(eb.life<=0){eBullets.splice(ei,1);continue;}if(tank.dashInv<=0&&Math.hypot(tank.x-eb.x,tank.y-eb.y)<tank.sz/2+eb.sz/2){if(!tank.godMode)tank.hp-=Math.floor(eb.dmg*shieldMult());updateHP();mkParticles(eb.x,eb.y,'hit',5);eBullets.splice(ei,1);if(tank.hp<=0){gameOver(false);return;}}}for(var pi=particles.length-1;pi>=0;pi--){particles[pi].x+=particles[pi].vx;particles[pi].y+=particles[pi].vy;particles[pi].l--;if(particles[pi].l<=0)particles.splice(pi,1);}for(var fti=floatTexts.length-1;fti>=0;fti--){floatTexts[fti].y-=1;floatTexts[fti].life--;if(floatTexts[fti].life<=0)floatTexts.splice(fti,1);}collectDrops();for(var eni=enemies.length-1;eni>=0;eni--){var en=enemies[eni],atx=Math.atan2(tank.y-en.y,tank.x-en.x),dtx=Math.hypot(tank.x-en.x,tank.y-en.y);en.moveAng=atx;switch(en.type){case'speeder':var zz=Math.sin(t*0.008+eni*2)*0.4;en.x+=Math.cos(atx+zz)*en.spd;en.y+=Math.sin(atx+zz)*en.spd;break;case'shooter':if(dtx>en.sRange){en.x+=Math.cos(atx)*en.spd;en.y+=Math.sin(atx)*en.spd;}else if(dtx<en.sRange*0.5){en.x-=Math.cos(atx)*en.spd*0.5;en.y-=Math.sin(atx)*en.spd*0.5;}if(t-en.lastShot>en.sCD){en.lastShot=t;eBullets.push({x:en.x,y:en.y,a:atx,spd:en.sSpd,sz:5,dmg:en.sDmg,life:150});}break;case'healer':en.x+=Math.cos(atx)*en.spd;en.y+=Math.sin(atx)*en.spd;if(t-en.lastHeal>en.hCD){en.lastHeal=t;en.flash=t+300;for(var hi=0;hi<enemies.length;hi++){if(hi===eni)continue;if(Math.hypot(enemies[hi].x-en.x,enemies[hi].y-en.y)<en.hRange)enemies[hi].hp=Math.min(enemies[hi].maxHp,enemies[hi].hp+en.hAmt);}}break;case'bomber':en.x+=Math.cos(atx)*en.spd;en.y+=Math.sin(atx)*en.spd;if(dtx<50)en.flash=t;break;default:en.x+=Math.cos(atx)*en.spd;en.y+=Math.sin(atx)*en.spd;break;}for(var bj=bullets.length-1;bj>=0;bj--){var bu=bullets[bj];if(Math.hypot(bu.x-en.x,bu.y-en.y)<en.sz/2+bu.sz/2){en.hp-=bu.dmg;mkParticles(bu.x,bu.y,'hit',3);if(bu.fx!=='fire'&&bu.fx!=='energy')bullets.splice(bj,1);if(en.hp<=0){handleKill(en);enemies.splice(eni,1);break;}}}if(eni>=enemies.length)continue;if(tank.dashInv<=0&&Math.hypot(tank.x-en.x,tank.y-en.y)<tank.sz/2+en.sz/2){if(!tank.godMode)tank.hp-=Math.floor(en.dmg*shieldMult());updateHP();en.x+=(en.x-tank.x)*0.5;en.y+=(en.y-tank.y)*0.5;if(tank.hp<=0){gameOver(false);return;}}}if(screenShakeAmount>0)screenShakeAmount*=0.85;if(screenShakeAmount<0.5)screenShakeAmount=0;draw();animId=requestAnimationFrame(update);}
function draw(){var t=Date.now();ctx.clearRect(0,0,canvas.width,canvas.height);var sx=0,sy=0;if(settings.screenShake&&screenShakeAmount>0){sx=(Math.random()-0.5)*screenShakeAmount;sy=(Math.random()-0.5)*screenShakeAmount;}ctx.save();ctx.translate(sx,sy);drawBG();for(var pi=0;pi<particles.length;pi++){var p=particles[pi];ctx.globalAlpha=p.l/p.ml;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fillStyle=p.c;ctx.fill();}ctx.globalAlpha=1;for(var di=0;di<drops.length;di++){var d=drops[di],el=t-d.st,fo=el>d.life-3000?(d.life-el)/3000:1,bob=Math.sin(t*0.005+di)*3;ctx.globalAlpha=fo;if(d.type==='health'){ctx.fillStyle='#2ecc71';ctx.fillRect(d.x-3,d.y-8+bob,6,16);ctx.fillRect(d.x-8,d.y-3+bob,16,6);}else if(d.type==='ammo'){ctx.fillStyle='#e67e22';ctx.fillRect(d.x-7,d.y-5+bob,14,10);ctx.fillStyle='#fff';ctx.font='bold 8px Courier New';ctx.textAlign='center';ctx.fillText('A',d.x,d.y+bob);}else if(d.type==='nuke'){ctx.fillStyle='#f44';ctx.beginPath();ctx.arc(d.x,d.y+bob,10,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}for(var bi2=0;bi2<bullets.length;bi2++){var b2=bullets[bi2];ctx.beginPath();if(b2.fx==='fire'){var g=ctx.createRadialGradient(b2.x,b2.y,0,b2.x,b2.y,b2.sz);g.addColorStop(0,'#f1c40f');g.addColorStop(1,'#e74c3c');ctx.fillStyle=g;}else ctx.fillStyle=b2.color||'#f1c40f';ctx.arc(b2.x,b2.y,b2.sz/2,0,Math.PI*2);ctx.fill();}for(var ei2=0;ei2<eBullets.length;ei2++){ctx.beginPath();ctx.arc(eBullets[ei2].x,eBullets[ei2].y,eBullets[ei2].sz/2,0,Math.PI*2);ctx.fillStyle='#ff4444';ctx.fill();}for(var eni2=0;eni2<enemies.length;eni2++){var en2=enemies[eni2],hpP=en2.hp/en2.maxHp,labelY=Math.max(20,en2.y-en2.sz/2-12);ctx.fillStyle='#e74c3c';ctx.fillRect(en2.x-en2.sz/2,labelY,en2.sz,5);ctx.fillStyle='#2ecc71';ctx.fillRect(en2.x-en2.sz/2,labelY,en2.sz*hpP,5);if(en2.lbl){ctx.fillStyle=en2.color;ctx.font='bold 8px Courier New';ctx.textAlign='center';ctx.fillText(en2.lbl,en2.x,Math.max(12,labelY-4));}ctx.beginPath();ctx.arc(en2.x,en2.y,en2.sz/2,0,Math.PI*2);ctx.fillStyle=en2.color;ctx.fill();}ctx.save();ctx.translate(tank.x,tank.y);ctx.rotate(tank.angle);ctx.fillStyle=isOwner?'#3a2a0a':'#2c3e50';ctx.fillRect(-tank.sz/2,-tank.sz/2,tank.sz,tank.sz);if(tank.godMode){ctx.shadowColor='#ff0';ctx.shadowBlur=15;}ctx.fillStyle=weapons[tank.curW].color||'#e74c3c';ctx.fillRect(0,-4,tank.sz/2+12,8);ctx.shadowBlur=0;ctx.strokeStyle=isOwner?'#ff0':'#34495e';ctx.lineWidth=2;ctx.strokeRect(-tank.sz/2,-tank.sz/2,tank.sz,tank.sz);ctx.restore();if(upgrades.spinners){var bc=upgrades.spinnerBlades+1;for(var si3=0;si3<bc;si3++){var dsa=spinnerAngle+Math.PI*2/bc*si3,sx3=tank.x+Math.cos(dsa)*45,sy3=tank.y+Math.sin(dsa)*45;ctx.beginPath();ctx.arc(sx3,sy3,7,0,Math.PI*2);ctx.fillStyle='rgba(93,92,222,0.8)';ctx.fill();}}if(upgrades.forceShield){var shieldRad=tank.sz*(1.3+upgrades.shieldSize*0.6);ctx.beginPath();ctx.arc(tank.x,tank.y,shieldRad,0,Math.PI*2);ctx.strokeStyle='rgba(0,255,255,'+(0.3+Math.sin(t*0.005)*0.15)+')';ctx.lineWidth=3;ctx.stroke();}for(var fi=0;fi<floatTexts.length;fi++){var ft=floatTexts[fi];ctx.globalAlpha=ft.life/ft.maxLife;ctx.fillStyle=ft.clr;ctx.font='bold 12px Courier New';ctx.textAlign='center';ctx.fillText(ft.txt,ft.x,ft.y);}ctx.globalAlpha=1;if(!tank.godMode&&tank.hp/tank.maxHp<0.3){var intensity=(1-tank.hp/tank.maxHp)*2,grad=ctx.createRadialGradient(tank.x,tank.y,canvas.width*0.3,tank.x,tank.y,canvas.width*0.8);grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(139,0,0,'+intensity*0.6+')');ctx.fillStyle=grad;ctx.fillRect(-sx,-sy,canvas.width,canvas.height);if(tank.hp/tank.maxHp<0.15){ctx.filter='blur('+Math.floor(intensity*3)+'px)';}}ctx.restore();ctx.filter='none';if(wave.bannerTxt&&t-wave.bannerST<wave.bannerDur){var be=t-wave.bannerST,ba=be<300?be/300:be>wave.bannerDur-500?(wave.bannerDur-be)/500:1;ctx.globalAlpha=ba;ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,canvas.height/2-50,canvas.width,100);ctx.fillStyle=getWorld().accent;ctx.font='bold 32px Courier New';ctx.textAlign='center';ctx.fillText(wave.bannerTxt,canvas.width/2,canvas.height/2);ctx.globalAlpha=1;}if(tank.godMode){ctx.fillStyle='#ff0';ctx.font='bold 14px Courier New';ctx.textAlign='right';ctx.fillText('👑 GOD MODE',canvas.width-20,40);}}
buildWeaponUI();updateSettingsUI();
